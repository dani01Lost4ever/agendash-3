name: Publish Release
# Manual only for now: a push to master must not publish to npm until the release pipeline
# (trusted publishing and the right version tags) is in place.
on:
  workflow_dispatch:

jobs:
  semantic-release:
    name: Semantic release
    runs-on: ubuntu-latest

    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The release does not run tests, so skip mongodb-memory-server's MongoDB download
      MONGOMS_DISABLE_POSTINSTALL: '1'

    steps:
      - name: Git checkout
        uses: actions/checkout@v5

      - name: Use Node.js with cache
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install modules
        run: npm ci --no-audit

      - name: Release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release@bot.com
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
