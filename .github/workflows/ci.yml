name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    env:
      # No tests here, so skip mongodb-memory-server's MongoDB download
      MONGOMS_DISABLE_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm pack --dry-run

  test:
    name: Test (Node ${{ matrix.node-version }}, MongoDB ${{ matrix.mongodb-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        mongodb-version: ['7.0.24', '8.2.6']
    env:
      MONGOMS_VERSION: ${{ matrix.mongodb-version }}
      # Download MongoDB into the cached directory; by default it goes to node_modules/.cache
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Cache MongoDB binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ matrix.mongodb-version }}

      - run: npm ci
      - run: npm test
